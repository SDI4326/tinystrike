name: CONTACT ZERO Windows EXE
on:
  push:
    branches:
      - contact-zero-native-remaster
    paths:
      - 'native/**'
      - '.github/workflows/contact-zero-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout native game source
        uses: actions/checkout@v4
      - name: Download Godot and Windows export templates
        run: |
          set -euxo pipefail
          VER="4.4.1-stable"
          ROOT="https://github.com/godotengine/godot/releases/download/${VER}"
          curl -fL --retry 4 "${ROOT}/Godot_v${VER}_linux.x86_64.zip" -o godot-linux.zip
          curl -fL --retry 4 "${ROOT}/Godot_v${VER}_export_templates.tpz" -o godot-templates.tpz
          unzip -qo godot-linux.zip
          chmod +x Godot_v${VER}_linux.x86_64
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -qo godot-templates.tpz 'templates/*' -d /tmp/godot-exp
          cp /tmp/godot-exp/templates/windows_release_x86_64.exe "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          cp /tmp/godot-exp/templates/windows_debug_x86_64.exe "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Download permissively licensed soldier and gun models
        run: |
          set -euxo pipefail
          mkdir -p native/assets
          ORIGIN="https://raw.githubusercontent.com/SDI4326/tinystrike/main/assets/models"
          curl -fL --retry 4 "${ORIGIN}/soldier_ct.glb" -o native/assets/soldier_ct.glb
          curl -fL --retry 4 "${ORIGIN}/soldier_t.glb" -o native/assets/soldier_t.glb
          curl -fL --retry 4 "${ORIGIN}/viewmodels/ak47.glb" -o native/assets/ak47.glb
          curl -fL --retry 4 "${ORIGIN}/viewmodels/npc-arms-ct.glb" -o native/assets/npc-arms-ct.glb
      - name: Download PBR terrain, CC0 industrial props and FPS hand animations
        run: |
          set -euxo pipefail
          mkdir -p native/assets/tex native/assets/kenney native/assets/rig native/assets/sfx
          ART="https://raw.githubusercontent.com/petroulacl/fps-buildings-env-kit/main/environment/ground-textures/ambientcg"
          for PAIR in "Asphalt021_2K-JPG asphalt" "Concrete012_2K-JPG concrete" "Metal063_2K-JPG metal"; do
            set -- $PAIR
            FOLDER="$1"
            NAME="$2"
            PREFIX="${FOLDER%%_*}"
            curl -fL --retry 4 "${ART}/${FOLDER}/${FOLDER}_Color.jpg" -o "native/assets/tex/${NAME}_color.jpg"
            curl -fL --retry 4 "${ART}/${FOLDER}/${FOLDER}_NormalGL.jpg" -o "native/assets/tex/${NAME}_normal.jpg"
          done
          KEN="https://raw.githubusercontent.com/Hidencod/tge-assets/main/packs"
          curl -fL --retry 4 "${KEN}/city-kit-roads/construction-fence.glb" -o native/assets/kenney/construction-fence.glb
          curl -fL --retry 4 "${KEN}/city-kit-roads/light-square.glb" -o native/assets/kenney/light-square.glb
          curl -fL --retry 4 "${KEN}/prototype-kit/crate.glb" -o native/assets/kenney/crate.glb
          curl -fL --retry 4 "${KEN}/space-kit/pipe-straight.glb" -o native/assets/kenney/pipe-straight.glb
          SFX="https://raw.githubusercontent.com/petroulacl/fps-asset-kit/main/sfx/gunshots"
          curl -fL --retry 4 "https://raw.githubusercontent.com/GeorgeQLe/assets-sfx-combat/main/assets/kenney/sci-fi-sounds/Audio/explosionCrunch_000.ogg" -o native/assets/sfx/gunshot.ogg
          curl -fL --retry 4 "https://raw.githubusercontent.com/GeorgeQLe/assets-sfx-combat/main/assets/kenney/impact-sounds/Audio/impactGeneric_light_000.ogg" -o native/assets/sfx/hit.ogg
          RIG="https://raw.githubusercontent.com/Ayush-Mohanty/FPS-Arms-3D/main/Models/fps_ak-74m_animations"
          curl -fL --retry 4 "${RIG}/scene.gltf" -o native/assets/rig/scene.gltf
          curl -fL --retry 4 "${RIG}/scene.bin" -o native/assets/rig/scene.bin
          for I in 0 1 2 3 4 5 6; do
            curl -fL --retry 4 "${RIG}/scene_${I}.png" -o "native/assets/rig/scene_${I}.png"
          done
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          base=Path('native/assets')
          for p in list((base/'rig').glob('*.png'))+list((base/'tex').glob('*.jpg')):
              im=Image.open(p)
              im.thumbnail((1024,1024),Image.Resampling.LANCZOS)
              im.save(p,quality=85) if p.suffix=='.jpg' else im.save(p,optimize=True)
              print('optimized',p,im.size)
          # Exported Sketchfab glTF references textures/*; the source also ships
          # the same bitmaps as scene_0..scene_6 in its root.
          expected=[
            'arms_baseColor.png',
            'arms_metallicRoughness.png',
            'arms_normal.png',
            'ak74m_baseColor.png',
            'ak74m_metallicRoughness.png',
            'ak74m_normal.png',
            'ak74m_specularf0.png',
          ]
          (base/'rig/textures').mkdir(parents=True,exist_ok=True)
          for i,name in enumerate(expected):
              (base/'rig'/f'scene_{i}.png').rename(base/'rig/textures'/name)
          gltf=json.loads((base/'rig/scene.gltf').read_text())
          print('Authored AK animations:',[a['name'] for a in gltf.get('animations',[])])
          for im in gltf.get('images',[]):
              source=base/'rig'/im['uri']
              assert source.exists(), f'GLTF texture missing: {source}'
          PY
      - name: Import project and verify Godot scripts
        run: |
          set -euxo pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path native --import --quit 2>&1 | tee import.log
          if grep -qE 'SCRIPT ERROR:|Parse Error:' import.log; then
            echo "GDScript validation failed"
            exit 1
          fi
      - name: Smoke test scene startup
        run: |
          set -euxo pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path native --quit-after 65 2>&1 | tee smoke.log
          if grep -qE 'SCRIPT ERROR:|Parse Error:|Invalid call|ERROR: Cannot open|ERROR: Failed to' smoke.log; then
            echo "Godot scene startup test failed."
            exit 1
          fi
      - name: In-engine game QA across all 3 maps
        run: |
          set -euxo pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path native --script res://qa.gd 2>&1 | tee qa.log
          grep -q "NATIVE_QA_SUCCESS" qa.log
          if grep -qE 'SCRIPT ERROR:|Parse Error:|Invalid call|ERROR: Cannot open|ERROR: Failed to' qa.log; then exit 1; fi
      - name: Export native Windows executable
        run: |
          set -euxo pipefail
          mkdir -p native/build
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path native --export-release "Windows Desktop" build/CONTACT_ZERO.exe 2>&1 | tee export.log
          test -s native/build/CONTACT_ZERO.exe
          file native/build/CONTACT_ZERO.exe
          if grep -qE 'SCRIPT ERROR:|Parse Error:|ERROR: Cannot export' export.log; then exit 1; fi
      - name: Visual game-frame capture (best effort)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libgl1 >/dev/null
          xvfb-run -a -s "-screen 0 1280x720x24" ./Godot_v4.4.1-stable_linux.x86_64 --path native --rendering-driver opengl3 --script res://capture.gd > capture.log 2>&1 || true
          tail -30 capture.log
          if test -s native/build/CONTACT_ZERO_qa.png; then
            echo "Captured Godot-rendered frame"
          else
            echo "Screenshot not available on this GPU-less runner"
          fi
      - name: Create distribution ZIP
        run: |
          cat > native/build/README.txt <<'EOF'
          CONTACT ZERO -- NATIVE WINDOWS x64
          -------------------------------------------------
          1. Extract this ZIP into a folder.
          2. Double-click CONTACT_ZERO.exe.
          3. Select the map; WASD moves, mouse aims.
          Shoot = LMB. Aim = RMB. Reload = R.
          Sprint = Shift. Jump = Space. Crouch = Ctrl. Menu = Esc.

          No browser and no installation of Godot required.
          Unverified Windows builds may prompt SmartScreen; this file is unsigned.
          3D soldiers/arms adapted from Quaternius Toon Shooter Game Kit (CC0).
          Contact Zero native game: community prototype, NOT Counter-Strike source.
          EOF
          (cd native/build && zip -9 -q CONTACT_ZERO_WINDOWS.zip CONTACT_ZERO.exe README.txt)
          ls -lh native/build/*
      - name: Upload downloadable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CONTACT_ZERO_WINDOWS
          path: native/build/CONTACT_ZERO_WINDOWS.zip
          if-no-files-found: error
      - name: Publish public GitHub release download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="contact-zero-native-windows-v2"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" native/build/CONTACT_ZERO_WINDOWS.zip --clobber --repo "${{ github.repository }}"
            if test -s native/build/CONTACT_ZERO_qa.png; then gh release upload "$TAG" native/build/CONTACT_ZERO_qa.png --clobber --repo "${{ github.repository }}"; fi
          else
            gh release create "$TAG" native/build/CONTACT_ZERO_WINDOWS.zip --target "${{ github.sha }}" --title "CONTACT ZERO - Native Windows x64" --notes "CONTACT ZERO v2 remaster. PBR maps, authored Cransh CC-BY skinned AK-74M arms with animations, upgraded AI and combat effects. Native Windows. Unzip and double-click CONTACT_ZERO.exe." --repo "${{ github.repository }}"
          if test -s native/build/CONTACT_ZERO_qa.png; then gh release upload "$TAG" native/build/CONTACT_ZERO_qa.png --clobber --repo "${{ github.repository }}"; fi
          fi
